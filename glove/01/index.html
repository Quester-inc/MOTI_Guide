<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MOTI 글러브 제품 안내">
  <title>MOTI 글러브 제품 안내 | Quester</title>
  <link rel="icon" type="image/png" href="../../assets/quester_logo.png">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0 max(1.5rem, calc((100% - 56rem) / 2));
      background: #fff;
      color: #182231;
      font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    header {
      display: flex;
      align-items: center;
      gap: .55rem;
      padding: 1.25rem 0;
      border-bottom: 1px solid #dae0e6;
      font-size: 1rem;
      font-weight: 700;
    }
    header img { width: 2rem; height: 2rem; }
    main { padding: clamp(3.5rem, 14vh, 8rem) 0; }
    .section-label { color: #2858a3; font-size: 1rem; font-weight: 700; }
    h1 {
      margin: .55rem 0 1.25rem;
      font-size: clamp(2.25rem, 7vw, 4rem);
      line-height: 1.2;
      letter-spacing: -.045em;
    }
    p { margin: 0; color: #455368; font-size: 1.125rem; line-height: 1.7; }
  </style>
</head>
<body>
  <header>
    <img src="../../assets/quester_logo.png" alt="" width="32" height="32">
    <span>Quester</span>
  </header>
  <main>
    <div class="section-label">제품 안내</div>
    <h1>MOTI 글러브</h1>
    <p>제품 사양과 사용법을 준비하고 있습니다.</p>
  </main>
</body>
</html>
